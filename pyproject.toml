[project]
name = "openahrush"
version = "0.1.0"
description = "Openahrush MVP (Python control plane + Rust data plane)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

# Root project has no runtime deps; packages live in apps/ and libs/
dependencies = []

[tool.uv.workspace]
# uv workspace: editable installs for local dev
members = [
  "libs/core",
  "libs/seo",
  "libs/backlinks",
  "apps/api",
  "apps/workers",
  "apps/integrations",
  "apps/reports",
  "apps/commoncrawl_ingest",
]

[tool.uv.sources]
# Workspace packages - these resolve to local editable installs
semrush-core = { workspace = true }
semrush-seo = { workspace = true }
semrush-backlinks = { workspace = true }
semrush-api = { workspace = true }
semrush-workers = { workspace = true }
semrush-integrations = { workspace = true }
semrush-reports = { workspace = true }
semrush-commoncrawl = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # handled by formatter
    "B008",   # Depends() in FastAPI is designed to be used in defaults
    "RUF022", # unsorted __all__ is fine for grouped organization
    "RUF012", # mutable class attributes work fine in SQLAlchemy
    "SIM108", # ternary is not always more readable
    "SIM117", # nested with is fine for readability
    "SIM102", # nested if is sometimes more readable than combined
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Many external libs return Any (json, jwt, httpx)
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
pretty = true

# Per-module overrides for tests and known issues
[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "semrush_workers.*",
    "semrush_integrations.services.*",
    "semrush_api.routers.*"
]
disable_error_code = ["arg-type", "misc", "assignment", "call-arg", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["apps", "libs"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning:.*semrush_.*",
  "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.33.0",
    "httpx>=0.28.1",
    "locust>=2.42.6",
    "minio>=7.2.20",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
]
