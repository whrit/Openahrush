[project]
name = "semrush-seo"
version = "0.1.0"
description = "Openahrush SEO utilities - URL normalization, parsing, and analysis"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "tldextract>=5.1",
    "urllib3>=2.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "cssselect>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_seo"]
