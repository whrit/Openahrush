[project]
name = "semrush-core"
version = "0.1.0"
description = "Openahrush shared core library - database, config, security"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_core"]
