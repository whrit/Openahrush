[project]
name = "semrush-api"
version = "0.1.0"
description = "Openahrush API - FastAPI public API and dashboard backend"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "python-multipart>=0.0.6",
    "semrush-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
semrush-api = "semrush_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_api"]

