[project]
name = "semrush-reports"
version = "0.1.0"
description = "Openahrush Reports - Export and PDF generation"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "semrush-core",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_reports"]

[tool.uv.sources]
semrush-core = { workspace = true }
