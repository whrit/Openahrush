[project]
name = "semrush-integrations"
version = "0.1.0"
description = "Openahrush Integrations - OAuth and third-party provider sync"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "httpx>=0.26",
    "semrush-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_integrations"]

