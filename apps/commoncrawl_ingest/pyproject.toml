[project]
name = "semrush-commoncrawl"
version = "0.1.0"
description = "Openahrush Common Crawl Ingest - Backlink data pipeline"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "whrit" }]

dependencies = [
    "httpx>=0.26",
    "semrush-core",
    "semrush-seo",
    "semrush-backlinks",
]

[project.optional-dependencies]
clickhouse = [
    "clickhouse-connect>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
cc-ingest = "semrush_commoncrawl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semrush_commoncrawl"]

